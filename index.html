    recordEvent(pos,'CAR_SWITCH_ENTERED',null,{node:pos,formerPursuer:pursuer});
  }
  function policeTurn(){
    const roads=network(),pursuerFrom=pursuer;
    if(turns===1){
      pursuer='bank';
      if(pursuitState==='TRAIL_BROKEN'){
        beginRoamingPursuer();roamingPursuer=GETAWAY_RULES.patrolStep(ROAMING_PURSUER_CONFIG,roads,roamingPursuer);pursuer=roamingPursuer.current;
        recordEvent(pos,'PURSUER_ENTERED_SEARCH',null,{from:'bank',to:pursuer});
      }
    }
    else if(pursuitState==='IDENTIFIED'||pursuitState==='REACQUIRED'){
      const pursuit=GETAWAY_RULES.trailAwareDecision(roads,pursuer,pos,previousPos);
      pursuer=pursuit.next;
      if(pursuit.roll!==null)recordEvent(pos,'PURSUER_TIE_BREAK',null,{roll:pursuit.roll,mode:pursuit.mode,trail:previousPos,shortestOptions:pursuit.shortestOptions,selected:pursuit.next});
    } else {
      if(!roamingPursuer)beginRoamingPursuer();
      roamingPursuer=GETAWAY_RULES.patrolStep(ROAMING_PURSUER_CONFIG,roads,roamingPursuer);
      pursuer=roamingPursuer.current;
      if(roamingPursuer.lastDestinationChoice)recordEvent(pos,'FORMER_PURSUER_DESTINATION_SELECTED',null,roamingPursuer.lastDestinationChoice);
    }
    if(pursuer===pos){const source=pursuitState==='CAR_SWITCHED'?'P3':'PURSUER';concludePoliceContact(pursuitState==='CAR_SWITCHED'?'PATROL_CAPTURE':'PURSUER_CAPTURE',source,pursuitState==='CAR_SWITCHED'?'FORMER_PURSUER_INTERCEPTED':'PURSUER_MOVED',pursuerFrom);draw();return;}
    if(switchPending){
      const conversionNode=pursuer;
      switchPending=false;pursuitState='CAR_SWITCHED';phase='CLEANUP';flightTurnsRemaining=FLIGHT_WINDOW;protectedDeparture=true;
      patrols=MAP_DATA.levelOnePatrols.map(config=>freshPatrolAwayFrom(config,['n44']));
      roamingPursuer=freshPatrolAwayFrom(ROAMING_PURSUER_CONFIG,['n44']);pursuer=roamingPursuer.current;
      bus=newBus([pos,pursuer,...patrols.map(patrol=>patrol.current),...objectives.map(task=>task.node)]);
      recordEvent(pos,'CAR_SWITCHED',null,{node:carSwitch.node,conversionNode,flightTurnsRemaining,resetPatrols:{P1:patrols[0].current,P2:patrols[1].current,P3:pursuer}});
      recordEvent(pos,'PHASE_TRANSITION_RESOLVED');draw();
      const runId=currentRun?.id,entryMotion=movementFinished;
      entryMotion.then(()=>{if(currentRun?.id!==runId||!protectedDeparture||pos!=='hideout')return;
        showMapTwoBriefingCard(()=>{previousPos='hideout';pos='n44';turns+=1;protectedDeparture=false;hideoutForegroundActive=true;
        recordEvent(pos,'FLIGHT_CLOCK_ADVANCED',null,{flightTurnsRemaining,automaticDeparture:true});
        recordEvent(pos,'PROTECTED_DEPARTURE',null,{from:'hideout',to:'n44',automatic:true,vehiclesAdvanced:false});draw();
        const departureMotion=movementFinished;departureMotion.then(()=>{if(currentRun?.id!==runId)return;hideoutForegroundActive=false;draw();});});
      });return;
    }
    if(pursuitState==='TRAIL_BROKEN'&&neighbours(pos).includes(pursuer)){
      pursuitState='REACQUIRED';roamingPursuer=null;recordEvent(pos,'TRAIL_REACQUIRED',null,{pursuer});
    }
    const patrolFroms=patrols.map(patrol=>patrol.current);
    patrols=patrols.map((patrol,index)=>GETAWAY_RULES.patrolStep(MAP_DATA.levelOnePatrols[index],roads,patrol));
    patrols.forEach((patrol,index)=>{if(patrol.lastDestinationChoice)recordEvent(pos,'PATROL_DESTINATION_SELECTED',null,{patrolId:`P${index+1}`,patternId:patrol.patternId,...patrol.lastDestinationChoice});});
    const interceptor=patrols.findIndex(patrol=>patrol.current===pos);
    if(interceptor>=0)concludePoliceContact('PATROL_CAPTURE',`P${interceptor+1}`,'PATROL_INTERCEPTED',patrolFroms[interceptor]);
    else {
      advanceCrewObjectives(roads);
      advanceBus(roadNetwork());
      const handoff=collectObjective();
      recordEvent(pos,'TURN_RESOLVED');
      if(handoff){showCrewHandoff(handoff,draw);return;}
      if(maybeTriggerImpasse())return;
    }
    draw();
  }
  function safeClosure(){
    const destination=phase==='GETAWAY'?'hideout':'bank';
    const choices=neighbours(pos).filter(next=>next!==previousPos&&next!==destination).map(next=>[pos,next]);
    for(let i=choices.length-1;i>0;i-=1){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}
    return choices.find(edge=>{
      const trial={blocked:[...activeLayout().blocked,edge]},g=GETAWAY_RULES.graph(activeMap(),trial);
      return GETAWAY_RULES.reachable(g,pos,destination)&&(!pursuer||GETAWAY_RULES.reachable(g,pursuer,pos));
    })||null;
  }
  function resolveRoadCard(){
    const edge=safeClosure();
    if(edge)dynamicBlocked.push(edge);
    cardState.resolved=true;
    const detail=edge?(()=>{const [from,to]=edge.map(nodeNumber).map(Number).sort((a,b)=>a-b);return `${ordinal(from)} to ${ordinal(to)} Avenue is closed. Everyone must route around.`;})():'The closure is behind you; no remaining route changes.';
    recordEvent(pos,'CARD_RESOLVED',{id:cardState.card.id,closedEdge:edge});
    showRoadClosedCard(detail);
  }
  const nodeNumber=id=>id.startsWith('n')?String(Number(id[1])*5+Number(id[2])+1):id.toUpperCase();
  const ordinal=n=>{const mod100=n%100;return `${n}${mod100>=11&&mod100<=13?'th':n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th'}`;};
  function resolveShortcut(){
    showShortcutCard();
  }
  function takeShortcut(next){
    const choices=neighbours(pos);
    if(!shortcutSelecting||!choices.includes(next))return;
    const from=pos;previousPos=from;pos=next;shortcutSelecting=false;cardState.resolved=true;recordEvent(next,'CARD_RESOLVED',{id:cardState.card.id,from,to:next});
    const occupied=patrols.findIndex(patrol=>pos===patrol.current);
    if(occupied>=0){conclude('PATROL_CAPTURE',`P${occupied+1}`,'SHORTCUT_ENTERED_PATROL');draw();return;}
    maybeSwitchCar();
    if(!carSwitch.used&&pursuitState!=='TRAIL_BROKEN'){
      pursuitState='TRAIL_BROKEN';beginRoamingPursuer();recordEvent(pos,'TRAIL_BROKEN',{id:cardState.card.id},{pursuer});
    }
    const handoff=collectObjective();
    if(handoff){showCrewHandoff(handoff,policeTurn);return;}
    if(phase==='CLEANUP'&&pos==='bank'&&allObjectivesComplete()){resolveAirportArrival();return;}
    policeTurn();
  }
  function maybeTriggerCard(){
    if(cardState.resolved||cardState.card||pos==='hideout'||pos==='bank'||cardCheckedNodes.has(pos))return false;
    cardCheckedNodes.add(pos);
    if(CARD_CHECK_DISABLED[phase]?.has(pos)){recordEvent(pos,'CARD_CHECK_SKIPPED',null,{reason:'NODE_DISABLED',phase});return false;}
    const eligibleCards=CARDS.filter(card=>!card.excludedNodes.includes(pos));
    if(!eligibleCards.length){recordEvent(pos,'CARD_CHECK_SKIPPED',null,{reason:'NO_ELIGIBLE_CARD'});return false;}
    const roll=Math.floor(Math.random()*20)+1;
    recordEvent(pos,'CARD_CHECK',{roll,triggered:roll<=2,eligibleCards:eligibleCards.map(card=>card.id)});
    if(roll<=2){
      cardState.card=eligibleCards[Math.floor(Math.random()*eligibleCards.length)];cardState.triggerNode=pos;
      currentRun.assignedCard=cardState.card.id;currentRun.cardTriggerNode=pos;
      recordEvent(pos,'CARD_TRIGGERED',{id:cardState.card.id,roll});
      if(cardState.card.id==='ROAD_CLOSED_AHEAD')resolveRoadCard();else resolveShortcut();
      return true;
    }
    return false;
  }
  const allObjectivesComplete=()=>objectives.every(task=>task.complete);
  function collectObjective(){
    if(phase!=='CLEANUP')return;
    const task=objectives.find(candidate=>!candidate.complete&&!candidate.pending&&candidate.node===pos);
    if(task){pos=task.node;task.pending=true;recordEvent(pos,'CREW_INTERSECTED',null,{taskId:task.id,node:task.node,routeId:task.routeId,playerOccupies:pos});return task;}
  }
  function advanceCrewObjectives(roads){
    if(phase!=='CLEANUP')return;
    const occupied=new Set(objectives.filter(task=>!task.complete).map(task=>task.node));
    objectives.filter(task=>!task.complete).forEach(task=>{
      const nextIndex=(task.routeIndex+task.direction+task.route.length)%task.route.length,target=task.route[nextIndex],from=task.node;
      occupied.delete(from);
      let next=GETAWAY_RULES.shortestStep(roads,from,target);
      const otherObjectives=objectives.filter(candidate=>candidate!==task&&!candidate.complete).map(candidate=>candidate.node);
      const tooClose=node=>otherObjectives.some(other=>GETAWAY_RULES.shortestDistance(roads,node,other)<3);
      if(occupied.has(next)||tooClose(next)){
        const open=(roads.get(from)||[]).filter(node=>!occupied.has(node)&&node!==pos&&node!==pursuer&&!tooClose(node));
        if(open.length){
          open.sort((a,b)=>GETAWAY_RULES.shortestDistance(roads,a,target)-GETAWAY_RULES.shortestDistance(roads,b,target));
          next=open[0];
        }else if(occupied.has(next)){ next=from; }
      }
      task.node=next;occupied.add(next);vehicleHeadings[task.id]=travelHeading(from,task.node)??vehicleHeadings[task.id];
      if(task.node===target)task.routeIndex=nextIndex;
      recordEvent(pos,'CREW_MOVED',null,{taskId:task.id,routeId:task.routeId,from,to:task.node,target});
    });
  }
  function showCrewHandoff(task,continueTurn){
    const person=task.id==='PAY_DRIVER'?'driver':'inside contact';
    const heading=travelHeading(previousPos,pos)??vehicleHeadings[task.id]??vehicleHeadings.PLAYER??0,side=directionUnit(heading+90),runId=currentRun?.id;
    vehicleHeadings.PLAYER=heading;rendezvousVisualOffsets={PLAYER:{x:-side.x*24,y:-side.y*24},[task.id]:{x:side.x*24,y:side.y*24}};animating=true;visualPositions=vehicleState();draw();
    setTimeout(()=>{if(currentRun?.id!==runId||!task.pending)return;animating=false;showCard('Cut Delivered',`You hand over the cut. One less loose end.`,[{label:'Keep moving',action:()=>{const firstPayment=!objectives.some(candidate=>candidate.complete);task.pending=false;task.complete=true;if(firstPayment){knownAssociateAfterTurn=turns+1;recordEvent(pos,'KNOWN_ASSOCIATE_STATE_ARMED',null,{activeAfterTurn:knownAssociateAfterTurn,taskId:task.id});}recordEvent(pos,'CREW_PAID',null,{taskId:task.id,node:task.node,routeId:task.routeId});rendezvousVisualOffsets={};hideCard();if(!maybeTriggerImpasse())continueTurn();}}]);if(task.id==='PAY_DRIVER'||task.id==='PAY_CONTACT'){const card=document.querySelector('.situation-card');card.classList.add('terminal-art-card','handoff-art-card');const image=document.createElement('img');image.className='terminal-art';image.src=task.id==='PAY_DRIVER'?'vignettes/crew-handoff-curbside-v1-candidate.png':'vignettes/crew-handoff-service-lot-v1-candidate.png';image.alt=task.id==='PAY_DRIVER'?'A curbside cash handoff between the yellow sports car and a cutman car.':'A service-lot cash handoff between the yellow sports car and a cutman car.';card.prepend(image);}},320);
  }
  function move(to){
    if(ended||awaitingCard||shortcutSelecting||animating||flightTransitioning||!neighbours(pos).includes(to))return;
    previousPos=pos;pos=to;turns+=1;
    if(phase==='CLEANUP'){
      flightTurnsRemaining=Math.max(0,flightTurnsRemaining-1);recordEvent(pos,'FLIGHT_CLOCK_ADVANCED',null,{flightTurnsRemaining});
      if(!flightTurnsRemaining&&!(pos==='bank'&&allObjectivesComplete())){missFlight('ROAD_TURN');draw();return;}
    }
    if(protectedDeparture){
      if(previousPos!=='hideout'||pos!=='n44')return;
      protectedDeparture=false;recordEvent(pos,'PROTECTED_DEPARTURE');draw();return;
    }
    const occupied=patrols.findIndex(patrol=>pos===patrol.current);
    if(occupied>=0){
      const patrol=patrols[occupied],config=MAP_DATA.levelOnePatrols[occupied],pattern=config.patterns.find(candidate=>candidate.id===patrol.patternId),target=pattern?.waypoints[patrol.waypointIndex],facing=vehicleHeadings[`P${occupied+1}`]??travelHeading(patrol.current,target);
      concludePoliceContact('PATROL_CAPTURE',`P${occupied+1}`,'PLAYER_ENTERED_PATROL',patrol.current,facing,'PLAYER');draw();return;
    }
    maybeSwitchCar();
    if(pos==='hideout'&&phase==='GETAWAY'){policeTurn();return;}
    const handoff=collectObjective();
    if(handoff){showCrewHandoff(handoff,policeTurn);return;}
    if(phase==='CLEANUP'&&pos==='bank'&&allObjectivesComplete()){resolveAirportArrival();return;}
    if(maybeTriggerCard())return;
    policeTurn();
  }
  document.getElementById('reset').onclick=()=>reset('MANUAL_RESET');
  document.getElementById('view-toggle').onclick=()=>{debugMode=!debugMode;renderViewMode();draw();};
  document.getElementById('map-preview').onclick=()=>{previewPhase=previewPhase?null:(phase==='GETAWAY'?'CLEANUP':'GETAWAY');draw();};
  document.getElementById('layout').onclick=()=>{if(currentRun&&!currentRun.outcome&&turns>0){recordEvent(null,'LAYOUT_CHANGED');finishRun('ABANDONED','LAYOUT_CHANGED');}const current=PLAYABLE_LAYOUT_INDICES.indexOf(layoutIndex),next=PLAYABLE_LAYOUT_INDICES[(current+1)%PLAYABLE_LAYOUT_INDICES.length];layoutIndex=next;currentRun=null;reset();};
  document.querySelectorAll('[data-contact-demo]').forEach(button=>button.onclick=()=>demoContact(button.dataset.contactDemo));
  document.getElementById('history-button').onclick=()=>{const panel=document.getElementById('history');panel.hidden=!panel.hidden;updateHistory();};
  document.getElementById('download-json').onclick=downloadJSON;
  document.getElementById('download-csv').onclick=downloadCSV;
  document.getElementById('clear-history').onclick=async()=>{if(confirm('Delete all saved Getaway Grid run history from this browser?')){localStorage.removeItem(LOG_KEY);runArchive=[];if(!runDatabase)runDatabase=await openRunDatabase();await databaseRequest('readwrite',store=>store.clear());updateHistory();}};
  document.getElementById('start-getaway').onclick=()=>{const intro=document.getElementById('intro-backdrop');intro.hidden=true;intro.classList.remove('staging');const splash=document.getElementById('level-splash');splash.textContent='LEVEL 1';splash.classList.remove('instruction','active');void splash.offsetWidth;splash.classList.add('active');window.setTimeout(()=>{splash.textContent='GET TO THE HIDEOUT';splash.classList.remove('active');void splash.offsetWidth;splash.classList.add('instruction','active');},1450);window.setTimeout(()=>splash.classList.remove('active'),2850);recordEvent(pos,'INTRO_COMPLETED');draw();};
  reset();initializeRunStorage();
})();
</script>
